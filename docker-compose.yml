services:
  db:
    restart: always
    image: postgres:latest
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - global

  web:
    restart: always
    build:
      dockerfile: ./Dockerfile-dev
      context: ./back/
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./back:/app
    depends_on:
      - db
    networks:
      - global

  aws:
    image: ministackorg/ministack:1.4.16
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      MINISTACK_HOST: aws
      SERVICES: s3
      S3_PERSIST: 1
      S3_DATA_DIR: /tmp/ministack-data/s3
    volumes:
      - ./init:/etc/localstack/init/ready.d
      - ./data/s3:/tmp/ministack-data/s3
    networks:
      - global

volumes:
  pgdata:

networks:
  global:
